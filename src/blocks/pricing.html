<!-- ============ PRICING ============ -->
<section class="block" id="pricing">
  <div class="wrap">
    <div class="label">{{pc_label}}</div>
    <h2 class="reveal">{{pc_h2}}</h2>
    <p class="sub reveal">{{pc_sub}}</p>
    <div class="pricing reveal">
      <div class="price-card accent">
        <span class="k">{{pc_sub_k}}</span>
        <h3>{{pc_sub_h}}</h3>
        <p>{{pc_sub_p}}</p>
      </div>
      <div class="price-card">
        <span class="k">{{pc_use_k}}</span>
        <h3>{{pc_use_h}}</h3>
        <ul class="meter">
          <li><b>{{pc_m1_h}}</b><span>{{pc_m1_p}}</span></li>
          <li><b>{{pc_m2_h}}</b><span>{{pc_m2_p}}</span></li>
          <li><b>{{pc_m3_h}}</b><span>{{pc_m3_p}}</span></li>
          <li><b>{{pc_m4_h}}</b><span>{{pc_m4_p}}</span></li>
          <li><b>{{pc_m5_h}}</b><span>{{pc_m5_p}}</span></li>
        </ul>
      </div>
    </div>
    <ul class="benefits reveal">
      <li>{{pc_n1}}</li><li>{{pc_n2}}</li><li>{{pc_n3}}</li>
    </ul>
  </div>
</section>
