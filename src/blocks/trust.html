<!-- ============ TRUST ============ -->
<section class="block" id="trust">
  <div class="wrap">
    <div class="label">{{tr_label}}</div>
    <h2 class="reveal">{{tr_h2}}</h2>
    <p class="sub reveal">{{tr_sub}}</p>
    <div class="trust-quote reveal">
      <figure>
        <blockquote>“What looks cheap to build becomes expensive to trust.”</blockquote>
        <p class="tq-tr">{{tq_tr}}</p>
        <figcaption>{{tq_cite}} <a href="https://cisr.mit.edu/publication/2026_0801_AIValuePropositions_Woerner" rel="noopener">MIT CISR Research Briefing</a>, {{tq_date}}</figcaption>
      </figure>
      <div class="tq-body">
        <span class="k">{{tq_k}}</span>
        <h3>{{tq_h}}</h3>
        <p>{{tq_p}}</p>
      </div>
    </div>
    <div class="grid-4">
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/><path d="M7 6.5h.01M7 17.5h.01"/></svg></div><h3>{{t1_h}}</h3><p>{{t1_p}}</p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></div><h3>{{t2_h}}</h3><p>{{t2_p}}</p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><h3>{{t3_h}}</h3><p>{{t3_p}}</p></div>
      <div class="card reveal"><div class="ico em"><svg viewBox="0 0 24 24"><path d="M12 22V12M12 12c0-4 3-7 8-8-1 5-4 8-8 8ZM12 15c0-3-2.5-5.5-7-6 .5 4 3 6 7 6Z"/></svg></div><h3>{{t4_h}}</h3><p>{{t4_p}}</p></div>
    </div>
    {{trust_more}}
  </div>
</section>
