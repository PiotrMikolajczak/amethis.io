<!-- ============ CLOSING ============ -->
<section class="closing" id="contact">
  <div class="wrap">
    <div class="closing-card reveal">
      <div class="label">{{cl_label}}</div>
      <h2>{{cl_h2}}</h2>
      <p class="sub">{{cl_sub}}</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="mailto:info@amethis.io?subject={{mail_subject}}">{{cl_cta}}</a>
      </div>
      <p style="margin-top:22px"><a class="mail" href="mailto:info@amethis.io">info@amethis.io</a></p>
      <p class="cl-alt"><a href="{{lp}}partners/">{{cl_alt}}</a></p>
    </div>
  </div>
</section>
