<!-- ============ HERO ============ -->
<section class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow"><span class="dot"></span>{{hero_eyebrow}}</span>
      <h1>{{hero_h1}} <span class="grad">{{hero_h1_grad}}</span></h1>
      <p class="tagline">{{hero_tag}}</p>
      <p class="lede">{{hero_lede}}</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="#contact">{{hero_cta1}}
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
        <a class="btn btn-ghost" href="#proof">{{hero_cta2}}</a>
      </div>
      <ul class="benefits">
        <li>{{ben1}}</li><li>{{ben2}}</li><li>{{ben3}}</li>
      </ul>
      <p class="proofline"><a href="#proof">{{hero_proofline}}</a></p>
    </div>

    <div class="scene" role="img" aria-label="{{scene_alt}}">
      <svg class="world" viewBox="0 -26 600 586" aria-hidden="true">
        <style>
        .world .g-cap { font: 600 10.5px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .1em; fill: #c4b5fd; }
        .world .g-req { font: 500 12.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f0f0f2; }
        .world .g-tile { font: 600 12px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f0f0f2; }
        .world .g-step { font: 600 12px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f0f0f2; }
        .world .g-sub { font: 500 10px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #87878f; }
        .world .g-pill { font: 600 10px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .04em; fill: #ddd6fe; }
        .world .g-card-h { font: 600 12.5px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f0f0f2; }
        </style>
        <defs>
          <linearGradient id="g-frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".03"/></linearGradient>
          <radialGradient id="g-token"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ddd6fe"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
          <path id="lane" d="M80 330 H520"/>
        </defs>

        <!-- 1 · requirement in business language -->
        <rect x="60" y="-12" width="480" height="96" rx="14" fill="#15131c" stroke="#3a3550"/>
        <g transform="translate(82 4)" fill="none" stroke="#c4b5fd" stroke-width="1.4" stroke-linecap="round"><path d="M2 1h8l4 4v10H2Z"/><path d="M5 9h6M5 12h4"/></g>
        <text class="g-cap" x="104" y="16">{{g_req_cap}}</text>
        <text class="g-req" x="82" y="44">{{g_req1}}</text>
        <text class="g-req" x="82" y="66">{{g_req2}}<tspan class="caret" fill="#a78bfa">▍</tspan></text>

        <!-- digital twin: a shadow copy of the running system, offset up and right like the twin icon -->
        <rect x="36" y="120" width="560" height="284" rx="22" fill="#8b5cf6" fill-opacity=".07" stroke="#6a5da8" stroke-opacity=".75" stroke-width="1.1" stroke-dasharray="4 4"/>
        <text class="g-cap" x="582" y="137" text-anchor="end">{{g_twin_cap}}</text>

        <path d="M150 84 V140" stroke="#a78bfa" stroke-width="1.6" class="flow" fill="none"/>
        <path d="M144 133 150 140 156 133" stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 2 · the governed system Amethis builds and runs; the opaque backing keeps the twin's dashed edge from showing through -->
        <rect x="20" y="146" width="560" height="284" rx="22" fill="#0b0a10"/>
        <rect x="20" y="146" width="560" height="284" rx="22" fill="url(#g-frame)" stroke="#6a5da8" stroke-width="1.2" stroke-dasharray="10 6"/>
        <text class="g-cap" x="44" y="174">{{g_build_cap}}</text>

        <g class="tile"><rect x="40" y="190" width="124" height="50" rx="10" fill="#1c1926" stroke="#2a2538"/>
          <g transform="translate(54 205)" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-linejoin="round"><rect x="0" y="1" width="20" height="17" rx="3"/><path d="M0 6h20M5 11h6"/></g>
          <text class="g-tile" x="82" y="220">{{g_t1}}</text></g>
        <g class="tile"><rect x="172" y="190" width="124" height="50" rx="10" fill="#1c1926" stroke="#2a2538"/>
          <g transform="translate(186 205)" fill="none" stroke="#c4b5fd" stroke-width="1.5"><ellipse cx="10" cy="4" rx="9" ry="3"/><path d="M1 4v11c0 1.7 4 3 9 3s9-1.3 9-3V4M1 9.5c0 1.7 4 3 9 3s9-1.3 9-3"/></g>
          <text class="g-tile" x="214" y="220">{{g_t2}}</text></g>
        <g class="tile"><rect x="304" y="190" width="124" height="50" rx="10" fill="#1c1926" stroke="#2a2538"/>
          <g transform="translate(318 205)" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"><path d="M6 1v5M14 1v5M3 6h14v4a7 7 0 0 1-14 0Z"/><path d="M10 17v3"/></g>
          <text class="g-tile" x="346" y="220">{{g_t3}}</text></g>
        <g class="tile"><rect x="436" y="190" width="124" height="50" rx="10" fill="#1c1926" stroke="#2a2538"/>
          <g transform="translate(450 205)" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h14M3 10h9M3 16h5"/><path d="m12 15 2.5 2.5L19 13"/></g>
          <text class="g-tile" x="478" y="220">{{g_t4}}</text></g>

        <text class="g-sub" x="44" y="276" letter-spacing="1.2">{{g_live}}</text>
        <path d="M80 330 H520" stroke="#3a3550" stroke-width="2" fill="none"/>
        <path d="M80 330 H520" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2" class="flow" fill="none"/>

        <!-- process steps -->
        <g>
          <circle cx="80" cy="330" r="24" fill="#15131c" stroke="#a78bfa" stroke-opacity=".8"/>
          <g transform="translate(70 320)" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M1 11 4 2h12l3 9v7H1Z"/><path d="M1 11h5l1 3h6l1-3h5"/></g>
          <text class="g-step" x="80" y="374" text-anchor="middle">{{g_s1}}</text>
          <text class="g-sub" x="80" y="390" text-anchor="middle">{{g_s1s}}</text>
        </g>
        <g>
          <rect x="207" y="310" width="40" height="40" rx="11" fill="#15131c" stroke="#34d399" stroke-opacity=".8" transform="rotate(45 227 330)"/>
          <g transform="translate(217 320)" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linejoin="round"><path d="M10 0c.9 5 3.3 7.6 9.5 9.5C13.3 11.4 10.9 14 10 19c-.9-5-3.3-7.6-9.5-9.5C6.7 7.6 9.1 5 10 0Z"/></g>
          <text class="g-step" x="227" y="374" text-anchor="middle">{{g_s2}}</text>
          <text class="g-sub" x="227" y="390" text-anchor="middle">{{g_s2s}}</text>
        </g>
        <g>
          <circle class="hil-ring" cx="373" cy="330" r="24" fill="none" stroke="#e9b96a"/>
          <circle cx="373" cy="330" r="24" fill="#15131c" stroke="#e9b96a"/>
          <g transform="translate(362 318)" fill="none" stroke="#f3d7a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="4.5"/><path d="M1 22c1.2-4.6 4.2-7 8-7 1.8 0 3.4.5 4.7 1.6"/><path d="m14 20 2.5 2.5L22 17"/></g>
          <text class="g-step" x="373" y="374" text-anchor="middle">{{g_s3}}</text>
          <text class="g-sub" x="373" y="390" text-anchor="middle">{{g_s3s}}</text>
          <g opacity="0">
            <rect x="313" y="278" width="120" height="22" rx="11" fill="#3a2c17" stroke="#e9b96a" stroke-opacity=".6"/>
            <text x="373" y="293" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#e9b96a">{{g_wait}}</text>
            <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.38;.42;.70;.74;1"/>
          </g>
        </g>
        <g>
          <rect x="500" y="310" width="40" height="40" rx="11" fill="#15131c" stroke="#34d399" stroke-opacity=".8" transform="rotate(45 520 330)"/>
          <g transform="translate(510 320)" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linejoin="round"><path d="M10 0c.9 5 3.3 7.6 9.5 9.5C13.3 11.4 10.9 14 10 19c-.9-5-3.3-7.6-9.5-9.5C6.7 7.6 9.1 5 10 0Z"/></g>
          <text class="g-step" x="520" y="374" text-anchor="middle">{{g_s4}}</text>
          <text class="g-sub" x="520" y="390" text-anchor="middle">{{g_s4s}}</text>
          <g opacity="0">
            <circle cx="542" cy="306" r="10" fill="#173b30" stroke="#34d399"/>
            <path d="m537 306 3.5 3.5 6.5-7" stroke="#6ee7b7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.96;.97;.995;1"/>
          </g>
        </g>
        <circle r="10" fill="url(#g-token)">
          <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.667;0.667;1" keyTimes="0;0.4;0.72;1"><mpath href="#lane"/></animateMotion>
        </circle>

        <!-- governance on the frame -->
        <g>
          <rect x="140" y="419" width="104" height="22" rx="11" fill="#1c1926" stroke="#6a5da8"/>
          <text class="g-pill" x="192" y="434" text-anchor="middle">{{g_p1}}</text>
          <rect x="250" y="419" width="100" height="22" rx="11" fill="#1c1926" stroke="#6a5da8"/>
          <text class="g-pill" x="300" y="434" text-anchor="middle">{{g_p2}}</text>
          <rect x="356" y="419" width="104" height="22" rx="11" fill="#1c1926" stroke="#6a5da8"/>
          <text class="g-pill" x="408" y="434" text-anchor="middle">{{g_p3}}</text>
        </g>

        <!-- 3 · existing systems and the digital twin -->
        <path d="M70 460 V430" stroke="#34d399" stroke-opacity=".6" stroke-width="1.4" class="flow rev" fill="none"/>
        <path d="M530 460 V430" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.4" class="flow" fill="none"/>
        <rect x="20" y="460" width="270" height="86" rx="14" fill="#15131c" stroke="#2f6f54"/>
        <g transform="translate(39 476)" fill="none" stroke="#6ee7b7" stroke-width="1.5"><ellipse cx="10" cy="4" rx="9" ry="3"/><path d="M1 4v13c0 1.7 4 3 9 3s9-1.3 9-3V4M1 10.5c0 1.7 4 3 9 3s9-1.3 9-3"/></g>
        <text class="g-card-h" x="72" y="492">{{g_legacy_h}}</text>
        <text class="g-sub" x="38" y="518">{{g_legacy_p1}}</text>
        <text class="g-sub" x="38" y="532">{{g_legacy_p2}}</text>
        <rect x="310" y="460" width="270" height="86" rx="14" fill="#15131c" stroke="#4a4566"/>
        <g transform="translate(328 476)" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-linejoin="round"><rect x="0" y="4" width="15" height="15" rx="3"/><rect x="7" y="0" width="15" height="15" rx="3" stroke-dasharray="3 2"/></g>
        <text class="g-card-h" x="362" y="492">{{g_twin_h}}</text>
        <text class="g-sub" x="328" y="518">{{g_twin_p1}}</text>
        <text class="g-sub" x="328" y="532">{{g_twin_p2}}</text>
      </svg>
    </div>
  </div>
</section>
