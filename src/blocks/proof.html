<!-- ============ PROOF ============ -->
<section class="block" id="proof">
  <div class="wrap">
    <div class="label">{{pr_label}}</div>
    <h2 class="reveal">{{pr_h2}}</h2>
    <p class="sub reveal status">{{pr_status}}</p>
    <div class="case reveal">
      <div class="case-top">
        <div><h3>{{pr_h3}}</h3><p>{{pr_p}}</p></div>
        <ul class="checks"><li>{{pr_c1}}</li><li>{{pr_c2}}</li><li>{{pr_c3}}</li></ul>
      </div>
      <div class="case-nums">
        <div><div class="v">300</div><div class="l">{{pr_n4}}</div></div>
        <div><div class="v">2</div><div class="l">{{pr_n1}}</div></div>
        <div><div class="v">3</div><div class="l">{{pr_n2}}</div></div>
        <div><div class="v">15</div><div class="l">{{pr_n3}}</div></div>
        <div><div class="v">0</div><div class="l">{{pr_n5}}</div></div>
      </div>
    </div>
    {{proof_more}}
  </div>
</section>
