<section class="block" id="metrics">

    <div class="label">{{pm_label}}</div>
    <h2 class="reveal">{{pm_h2}}</h2>
    <p class="sub reveal">{{pm_sub}}</p>
    <div class="grid-3">
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg></div><h3>{{f1_h}}</h3><p>{{f1_p}}</p></div>
      <div class="card reveal"><div class="ico em"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg></div><h3>{{f2_h}}</h3><p>{{f2_p}}</p></div>
      <div class="card reveal"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16V9M11 16V5M16 16v-4M21 16V8"/></svg></div><h3>{{f3_h}}</h3><p>{{f3_p}}</p></div>
    </div>
  </div>
</section>
