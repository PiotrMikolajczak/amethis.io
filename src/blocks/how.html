<!-- ============ HOW IT WORKS ============ -->
<section class="block" id="how">
  <div class="wrap">
    <div class="label">{{how_label}}</div>
    <h2 class="reveal">{{how_h2}}</h2>
    <p class="sub reveal">{{how_sub}}</p>
    <div class="steps">
      <div class="step reveal"><h3>{{st1_h}}</h3><p>{{st1_p}}</p></div>
      <div class="step reveal"><h3>{{st2_h}}</h3><p>{{st2_p}}</p></div>
      <div class="step reveal"><h3>{{st3_h}}</h3><p>{{st3_p}}</p></div>
    </div>
    <div class="wide-single">
      <div class="wide reveal">
        <div class="ico em"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="13" rx="2.5"/><rect x="9" y="3" width="13" height="13" rx="2.5" stroke-dasharray="3 2"/></svg></div>
        <div><h3>{{twin_h}}</h3><p>{{twin_p}}</p></div>
      </div>
    </div>
    <p class="note reveal">{{how_note}}</p>
  </div>
</section>
